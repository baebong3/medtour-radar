name: briefing-upload

# docs/briefings 에 PDF를 올리기만 하면 모음 페이지를 자동으로 갱신한다.
# 파일명은 brief_YYYYMMDD.pdf 가 정식이지만, 이슈브리핑_YYYYMMDD.pdf 처럼
# 8자리 날짜가 들어 있으면 알아서 바꿔 준다.

on:
  push:
    paths:
      - 'docs/briefings/**.pdf'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: briefing-upload
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt

      - name: Normalize filenames
        run: |
          shopt -s nullglob
          for f in docs/briefings/*.pdf; do
            b=$(basename "$f")
            if [[ ! "$b" =~ ^brief_[0-9]{8}\.pdf$ ]]; then
              d=$(echo "$b" | grep -oE '[0-9]{8}' | head -1)
              if [ -n "$d" ]; then
                mv -f "$f" "docs/briefings/brief_$d.pdf"
                echo "이름 변경 : $b -> brief_$d.pdf"
              else
                echo "날짜를 찾지 못해 건너뜀 : $b"
              fi
            fi
          done

      - name: Rebuild briefing list
        run: |
          python radar/briefings.py
          python radar/build.py --days 7 || echo "메인 페이지 갱신 실패 - 모음 페이지만 갱신함"

      - name: Commit
        run: |
          git config user.name  "medtour-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/briefings docs/index.html
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "브리핑: 모음 페이지 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          fi
